<!doctype html>
<html lang="id" data-root="."><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kegiatan Tim Sosial BPS Babel</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="./css/tokens.css"><link rel="stylesheet" href="./css/site.css"></head>
<body data-page="directory">
<a class="skip-link" href="#main-content">Lewati ke konten</a>
<header class="site-header"><div class="header-inner"><a class="brand" href="./">Tim Sosial <span>BPS Kepulauan Bangka Belitung</span></a><nav aria-label="Navigasi utama"><a href="./" aria-current="page">Beranda</a><a href="./arsip/">Arsip</a><a class="admin-entry" href="#">Admin</a></nav></div></header>
<main id="main-content" tabindex="-1"><div class="page-intro">
<h1>Kegiatan Tim Sosial</h1>
<p>Temukan jadwal, informasi, dan tautan kegiatan dalam satu tempat.</p>
</div>
<form id="directory-form" class="filters" method="get" role="search" data-scope="all">
<div class="search-row">
<div class="search-field"><label for="search">Cari kegiatan</label><div class="search-input"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" name="q" maxlength="200" type="search" placeholder="Contoh: rapat koordinasi, pelatihan" autocomplete="off"></div></div>
<button class="primary" type="submit">Cari</button>
</div>
<fieldset class="status-filter"><legend>Status</legend>
<label class="chip"><input type="radio" name="status" value="all" checked><span>Semua</span></label>
<label class="chip"><input type="radio" name="status" value="upcoming"><span>Akan datang</span></label>
<label class="chip"><input type="radio" name="status" value="ongoing"><span>Berlangsung</span></label>
<label class="chip"><input type="radio" name="status" value="finished"><span>Selesai</span></label>
<a class="reset" href="./" data-reset hidden>Hapus filter</a>
</fieldset>
</form>
<p id="directory-feedback" role="status" aria-live="polite"></p>
<button id="directory-retry" type="button" hidden>Coba lagi</button>
<noscript><p class="empty-state">Portal ini memerlukan JavaScript untuk menampilkan kegiatan.</p></noscript>
<div id="directory-results"></div></main>
<footer class="site-footer">Portal kegiatan Tim Sosial · Semua jadwal dalam WIB</footer>
